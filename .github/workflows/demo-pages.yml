# Demo statica su GitHub Pages: l'app gira interamente nel browser con dati dimostrativi.
# Il build viene eseguito a ogni push (come verifica); la pubblicazione avviene solo dal branch principale.
# Prima volta: Settings → Pages → Build and deployment → Source: "GitHub Actions".
name: Demo su GitHub Pages

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build della demo
        run: npm run demo:build
        env:
          # Indirizzo del progetto su GitHub Pages: https://<utente>.github.io/<repository>/
          DEMO_BASE: /${{ github.event.repository.name }}/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: demo/dist

  deploy:
    needs: build
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
