<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0b0c" />
    <meta name="description" content="Demo del gestionale premium per centri estetici: prenotazioni, clienti, promozioni, eventi e programma fedeltà." />
    <link rel="icon" href="./icon.svg" />
    <link rel="apple-touch-icon" href="./icon-192.png" />
    <title>Aurea · Beauty Management (demo)</title>
    <style>
      #boot { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; background: #0b0b0c; color: #faf7f0; font-family: Georgia, serif; text-align: center; padding: 24px; z-index: 100; }
      #boot .ring { width: 54px; height: 54px; border-radius: 50%; border: 1px solid rgba(201,169,110,.25); border-top-color: #c9a96e; animation: spin 1.1s linear infinite; }
      #boot p { margin: 0; letter-spacing: .2em; text-transform: uppercase; font: 11px/1.6 system-ui, sans-serif; color: #c9a96e; }
      #boot small { font: 13px/1.5 system-ui, sans-serif; color: rgba(250,247,240,.55); max-width: 320px; }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="boot"><div class="ring"></div><p>Aurea · Demo</p><small id="boot-msg">Preparazione della demo…</small></div>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
