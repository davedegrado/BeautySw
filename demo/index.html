<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0b0c" />
    <meta name="description" content="Demo del gestionale premium per centri estetici: prenotazioni, clienti, promozioni, eventi e programma fedeltà." />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Aurea" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" href="%BASE_URL%icon.svg" />
    <link rel="apple-touch-icon" href="%BASE_URL%icon-192.png" />
    <title>Aurea · Beauty Management (demo)</title>
    <style>
      #boot { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; background: #0b0b0c; color: #faf7f0; font-family: Georgia, serif; text-align: center; padding: 24px; z-index: 100; }
      #boot .ring { width: 54px; height: 54px; border-radius: 50%; border: 1px solid rgba(201,169,110,.25); border-top-color: #c9a96e; animation: spin 1.1s linear infinite; }
      #boot p { margin: 0; letter-spacing: .2em; text-transform: uppercase; font: 11px/1.6 system-ui, sans-serif; color: #c9a96e; }
      #boot small { font: 13px/1.5 system-ui, sans-serif; color: rgba(250,247,240,.55); max-width: 320px; }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="boot"><div class="ring"></div><p>Aurea · Demo</p><small id="boot-msg">Preparazione della demo…</small><small id="boot-err" style="display:none;font:11px/1.5 ui-monospace,Menlo,monospace;color:rgba(250,247,240,.4);word-break:break-word"></small></div>
    <script>
      // Diagnostica di avvio (volutamente in JavaScript "vecchio stile": deve funzionare anche se il resto non parte).
      (function () {
        var shown = false;
        window.__bootError = function (e) {
          var boot = document.getElementById("boot");
          if (!boot || shown) return;
          shown = true;
          var ring = boot.querySelector(".ring");
          if (ring) ring.style.display = "none";
          var text = e && (e.message || e.reason || e) ? String((e.name ? e.name + ": " : "") + (e.message || e.reason || e)) : "errore sconosciuto";
          document.getElementById("boot-msg").textContent =
            "Non è stato possibile avviare la demo su questo dispositivo. Chiudi le altre schede e riprova; se il problema resta, comunica il dettaglio qui sotto.";
          var d = document.getElementById("boot-err");
          d.style.display = "block";
          d.textContent = text.slice(0, 300);
        };
        window.addEventListener("error", function (ev) { if (document.getElementById("boot")) window.__bootError(ev.error || ev.message); });
        window.addEventListener("unhandledrejection", function (ev) { if (document.getElementById("boot")) window.__bootError(ev.reason); });
        setTimeout(function () {
          var m = document.getElementById("boot-msg");
          if (m && !shown) m.textContent += " Il primo avvio può richiedere fino a un minuto: vengono scaricati circa 15 MB.";
        }, 12000);
      })();
    </script>
    <script nomodule>window.__bootError("Browser troppo datato: servono Safari 16.4 o successivi, Chrome o Firefox recenti.");</script>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
